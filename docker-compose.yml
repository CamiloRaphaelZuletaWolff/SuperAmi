services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ami
      POSTGRES_PASSWORD: ami
      POSTGRES_DB: ami
    ports:
      # solo localhost: user/clave ami/ami no deben quedar abiertos a la red
      - "127.0.0.1:5434:5432"
      - "[::1]:5434:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ami_pgdata:/var/lib/postgresql/data

volumes:
  ami_pgdata:
