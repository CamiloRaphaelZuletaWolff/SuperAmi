# Render Blueprint del backend AMI (FastAPI). Guía completa: DEPLOY.md
#
# Render Dashboard -> New + -> Blueprint -> elegir este repo. Render pide los
# valores marcados `sync: false` (secretos: no viajan en el repo).
#
# La base NO vive en Render: la Postgres gratuita de Render expira a los 30 días.
# Se usa Neon (free, sin expiración, trae pgvector). DATABASE_URL es la cadena de
# Neon con ?sslmode=require. La base se carga UNA vez con el dump (DEPLOY.md §3).
services:
  - type: web
    name: ami-backend
    runtime: docker
    plan: free            # duerme tras 15 min sin tráfico (~50 s de arranque en frío)
    region: oregon        # misma región que Neon (AWS us-west-2) -> menos latencia por query
    healthCheckPath: /health
    autoDeploy: true      # cada push a main redespliega (el CI corre en GitHub Actions)
    envVars:
      - key: PROVIDER
        value: gemini
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: MODELO_POTENTE
        value: gemini-flash-latest
      - key: MODELO_ECONOMICO
        value: gemini-flash-lite-latest
      - key: MODELO_EMBEDDINGS
        value: gemini-embedding-001   # debe coincidir con el dump cargado (gemini)
      - key: EMBEDDING_DIM
        value: "1024"
      - key: CHAT_RATE_LIMIT_PER_MIN
        value: "12"
      # --- valores que Render te pide al crear el Blueprint ---
      - key: DATABASE_URL         # postgresql://user:pass@ep-xxx.us-west-2.aws.neon.tech/neondb?sslmode=require
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS         # https://<tu-frontend>.vercel.app (sin "/" final)
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
